name: Deploy to Hugging Face Space

on:
  push:
    branches:
      - main
    paths:
      - 'availability.json'
      - 'content/**'
      - 'cpp_os_server.cpp'
      - 'Dockerfile'
      - 'requirements.txt'
      - 'index.html'
      - '**.py'
      - '!receipts/**'
      - '!.github/workflows/*'
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_SPACE_NAME: ${{ secrets.HF_SPACE_NAME }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure git
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          git config --global init.defaultBranch main

      - name: Install git-lfs
        run: |
          sudo apt-get install -y git-lfs
          git lfs install

      - name: Clone existing HF space
        run: |
          rm -rf hf-space
          git clone https://hf_user:${HF_TOKEN}@huggingface.co/spaces/${HF_SPACE_NAME} hf-space || mkdir -p hf-space

      - name: Sync files to HF space (exclude binaries + secrets)
        run: |
          rm -rf hf-space/*
          rsync -av \
            --exclude='hf-space' \
            --exclude='.git' \
            --exclude='.env' \
            --exclude='debug' \
            --exclude='.github' \
            --exclude='*.png' \
            --exclude='*.jpg' \
            --exclude='*.jpeg' \
            --exclude='*.gif' \
            --exclude='*.mp4' \
            --exclude='*.webm' \
            --exclude='*.zip' \
            --exclude='*.tar.gz' \
            --exclude='*.db' \
            --exclude='*.dmg' \
            --exclude='*.bin' \
            --exclude='artifacts/' \
            --exclude='rm_traffic/' \
            --exclude='cpp_os_server' \
            --exclude='rotator_engine' \
            --exclude='ga_rl_optimizer' \
            --exclude='production_control_loop' \
            . hf-space/
          rm -rf hf-space/.env hf-space/debug hf-space/.github hf-space/artifacts hf-space/rm_traffic
          # Remove any remaining binary/executable files that HF would reject
          find hf-space -type f -executable ! -name "*.py" ! -name "*.sh" -delete 2>/dev/null || true
          find hf-space -type f \( -name "*.o" -o -name "*.so" -o -name "*.dylib" \) -delete 2>/dev/null || true

      - name: Set HF Space secrets via API
        run: |
          for KEY_VAL in \
            "RENTMASSEUR_USERNAME=${{ secrets.RENTMASSEUR_USERNAME }}" \
            "RENTMASSEUR_PASSWORD=${{ secrets.RENTMASSEUR_PASSWORD }}" \
            "GROQ_API_KEY=${{ secrets.GROQ_API_KEY }}" \
            "GROQ_MODEL=llama-3.3-70b-versatile" \
            "HF_SPACE_NAME=${HF_SPACE_NAME}" \
            "GH_TOKEN=${{ secrets.GH_PAT }}" \
            "GH_REPO=overandor/rentmasseur-extension"; do
            KEY="${KEY_VAL%%=*}"
            VAL="${KEY_VAL#*=}"
            echo "Setting HF Space secret: $KEY"
            curl -s -X POST \
              "https://huggingface.co/api/spaces/${HF_SPACE_NAME}/secrets" \
              -H "Authorization: Bearer ${HF_TOKEN}" \
              -H "Content-Type: application/json" \
              -d "{\"key\":\"$KEY\",\"value\":\"$VAL\"}" || true
          done

      - name: Push to HF space
        run: |
          cd hf-space
          rm -f .gitignore
          rm -rf .git
          git init -b main
          git lfs install
          git lfs track "*.bin" "*.h5" "*.safetensors" "*.onnx"
          git add -A
          git commit -m "Auto-deploy $(date -u +%Y-%m-%d-%H:%M:%S)" --allow-empty
          git push https://hf_user:${HF_TOKEN}@huggingface.co/spaces/${HF_SPACE_NAME} main --force

      - name: Verify HF Space health
        continue-on-error: true
        run: |
          SPACE_URL=$(echo "${HF_SPACE_NAME}" | sed 's|/|-|g')
          HEALTH_URL="https://${SPACE_URL}.hf.space/api/health"
          echo "Health URL: ${HEALTH_URL}"
          sleep 90
          for i in 1 2 3; do
            echo "Health check attempt $i..."
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 "${HEALTH_URL}")
            echo "Status: $HTTP_CODE"
            if [ "$HTTP_CODE" == "200" ]; then
              echo "PASS: HF Space healthy"
              exit 0
            fi
            sleep 60
          done
          echo "WARNING: HF Space not responding yet (may still be building)"
